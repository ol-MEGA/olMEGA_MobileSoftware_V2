plugins {
    id('com.android.application')
    id("de.undercouch.download") version "5.6.0"
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.iha.olmega_mobilesoftware_v2"
        minSdkVersion 30
        targetSdkVersion 33
        versionCode 3
        versionName '3.0beta3'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    //repositories {
    //    maven {
    //        url "https://jitpack.io"
    //    }
    //}
    namespace 'com.iha.olmega_mobilesoftware_v2'
    buildFeatures {
        buildConfig true
    }
    buildToolsVersion '35.0.1'
    //sourceSets {
    //    main {
    //        assets {
    //            srcDirs 'src\\main\\assets'
    //        }
    //    }
    //}
}

// import DownloadModels task
project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
project.ext.TEST_ASSET_DIR = projectDir.toString() + '/src/androidTest/assets'
apply from:'download_model.gradle'

dependencies {

    // JTransforms FFT library - https://github.com/wendykierp/JTransforms
    implementation 'com.github.wendykierp:JTransforms:3.1'

    // Silero VAD - https://github.com/gkonovalov/android-vad
    implementation 'com.github.gkonovalov.android-vad:silero:2.0.10'

    // mediapipe Library
    implementation 'com.google.mediapipe:tasks-audio:0.10.26.1'

    // ONNX Runtime
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:latest.release'

    // TensorFlow Lite
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.5.0'

    // OpenCSV
    implementation 'com.opencsv:opencsv:5.12.0'

    // App compat and UI
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // App updater library - https://github.com/javiersantos/AppUpdater
    implementation 'com.github.javiersantos:AppUpdater:2.7'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'

    // Instrumented testing
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
